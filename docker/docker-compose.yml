version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: genie-light-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: genie
      POSTGRES_PASSWORD: genielight2026
      POSTGRES_DB: genie_light_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: genie-light-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: genie_minio
      MINIO_ROOT_PASSWORD: genie_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  adminer:
    image: adminer:latest
    container_name: genie-light-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
