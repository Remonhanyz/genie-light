version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: genie-light-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: genie
      POSTGRES_PASSWORD: genielight2026
      POSTGRES_DB: genie_light_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: genie-light-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
